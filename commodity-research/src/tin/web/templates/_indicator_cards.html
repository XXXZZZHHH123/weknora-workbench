{% from "_card.html" import trend %}
{% for m in cards %}
<div class="indicator-favorite" data-favorite-card="{{ m.series_id }}">
  {{ trend(m, d) }}
  <div class="indicator-card-actions">
    <span class="indicator-muted">{% if m.retired %}<b class="indicator-warning">已停用</b> · {% endif %}{% if m.stale %}<b class="indicator-warning">更新滞后</b> · {% endif %}{{ m.frequency }}频</span>
    {% if m.registered %}<a href="{{ research_prefix() }}/sn/indicators/{{ m.series_id }}">口径与来源</a>{% endif %}
    <button type="button" class="indicator-bookmark favorites-star" data-favorite="{{ m.series_id }}" data-favorite-kind="indicator" data-favorite-label="{{ m.name }}" disabled aria-pressed="false" aria-label="加入自选 {{ m.name }}">☆ 自选</button>
  </div>
</div>
{% endfor %}
