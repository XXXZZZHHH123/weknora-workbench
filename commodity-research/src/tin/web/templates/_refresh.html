<section id="research-refresh" data-rendered-date="{{ d or '' }}" class="research-panel refresh-card">
  <div class="refresh-card-heading">
    <div><h2>数据更新</h2><p class="text-xs text-[var(--text-muted)] mt-1">自动收集官方数据、校验并入库，同时更新派生指标与个人信号。</p></div>
    <div class="flex gap-2">
      <button id="refresh-now" type="button" class="research-button primary"
        {% if research_identity() and not research_identity().can_write %}disabled{% endif %}>立即更新</button>
      <button id="refresh-settings-toggle" type="button" class="research-button secondary"
        {% if research_identity() and not research_identity().can_write %}disabled{% endif %}>更新设置</button>
    </div>
  </div>
  <div class="refresh-card-state"><span id="refresh-status" role="status" class="refresh-state-badge">正在读取更新状态…</span><span id="refresh-summary"></span></div>
  <div class="refresh-metrics">
    <div><small>行情截至</small><strong id="refresh-trade">暂无</strong></div>
    <div><small>下次自动更新</small><strong id="refresh-next">暂无</strong></div>
    <div><small>最近成功更新</small><strong id="refresh-success">暂无</strong></div>
  </div>
  <details class="refresh-source-details"><summary>来源更新明细 <span>查看各来源数据时间与重试</span><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 9 6 6 6-6"/></svg></summary>
  <div class="overflow-x-auto"><table class="refresh-source-table"><thead><tr class="border-b border-[var(--line)]">
    <th class="py-2 pr-4">来源</th><th class="py-2 pr-4">最近结果</th><th class="py-2 pr-4">数据截至</th><th class="py-2 pr-4">最近尝试 / 成功</th><th class="py-2 pr-4">本次入库</th><th class="py-2">操作</th>
    </tr></thead><tbody id="refresh-sources"></tbody></table></div></details>
  <div id="refresh-settings" class="refresh-settings hidden space-y-3">
    <label class="flex gap-2 items-center text-sm"><input id="refresh-enabled" type="checkbox">开启每天自动更新</label>
    <label class="block text-sm">北京时间（用逗号分隔）<input id="refresh-times" class="block mt-1 px-3 py-2 rounded-md text-sm w-full" placeholder="08:00, 16:30"></label>
    <fieldset id="refresh-source-settings" class="flex flex-wrap gap-x-5 gap-y-2 text-sm"></fieldset>
    <button id="refresh-settings-save" type="button" class="research-button primary">保存设置</button>
  </div>
  <p class="refresh-footnote">自动更新共享指标与个人信号，保留研究判断和已审核简报。“尚未发布”时沿用已有数据；简报生成需另行发起。</p>
</section>
<script src="{{ research_prefix() }}/static/refresh.js?v={{ static_version() }}"></script>
