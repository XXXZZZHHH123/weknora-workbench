<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究工作台暂时无法打开</title>
<link rel="stylesheet" href="{{ research_static_prefix() }}/static/app.css?v={{ static_version() }}">
</head>
<body class="min-h-screen">
{# 这一页刻意不继承 base.html：外壳自己要查库（行情条与日期范围），
   而库正落后——继承就会在渲染提示的过程中再炸一次。 #}
<div style="max-width:44rem;margin:12vh auto;padding:0 1.5rem">
  <div class="rounded-lg p-6" style="border:1px solid var(--amber);background:var(--amber-soft)">
    <h1 class="text-xl font-black">研究工作台暂时无法打开</h1>
    <p class="text-xs mt-3 leading-relaxed" style="color:var(--text-muted)">数据服务需要更新。请联系管理员，更新完成后刷新本页。</p>
    {% if can_view_diagnostics() %}<details class="mt-4"><summary>管理员诊断信息</summary>
    <p class="text-xs mt-3" style="white-space:pre-line">{{ setup_error }}</p>
    <pre class="mt-4 p-3 rounded text-xs tabular"
         style="background:var(--surface);border:1px solid var(--line);overflow-x:auto">conda activate tin
cd {{ project_root }}
alembic upgrade head</pre>
    </details>{% endif %}
  </div>
</div>
</body>
</html>
