{% if research_workbench() and research_identity() and research_identity().can_write %}
<span class="brief-export inline-flex items-center gap-2 text-xs" data-export-kind="{{ export_kind }}" data-export-id="{{ export_id }}" data-export-kb="{{ research_workbench().knowledge_base_id }}">
  <details class="relative">
    <summary class="list-none cursor-pointer px-2.5 py-1 font-semibold rounded border border-[var(--line)] hover:bg-[var(--surface-soft)] inline-flex items-center gap-1.5" aria-label="导出日报到知识库">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m-3-3 3 3 3-3M3 10v3h10v-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>导出到知识库
    </summary>
    <form class="absolute right-0 top-full mt-1.5 z-40 w-64 p-3 rounded-lg border border-[var(--line)] bg-[var(--surface)] shadow-md space-y-2.5" data-export-form>
      <label class="block text-[11px] text-[var(--text-muted)]">保存到绑定知识库
        <select data-export-folder class="block w-full mt-1 px-2 py-1.5 rounded border border-[var(--line)] bg-[var(--surface)] text-[var(--text)]" aria-label="日报导出文件夹" disabled><option value="">正在读取文件夹…</option></select>
      </label>
      <div class="flex justify-between items-center gap-2"><span class="text-[10px] text-[var(--text-muted)]">Markdown · 沿用文档解析</span><button data-export-submit type="submit" class="px-2.5 py-1 rounded bg-[var(--primary)] text-white font-semibold hover:bg-[var(--primary-hover)] disabled:opacity-50" disabled>确认导出</button></div>
    </form>
  </details>
  <span data-export-status class="text-[11px] text-[var(--text-muted)]" role="status" aria-live="polite"></span>
</span>
<script defer src="{{ research_static_prefix() }}/static/brief-export.js?v={{ static_version() }}"></script>
{% endif %}
