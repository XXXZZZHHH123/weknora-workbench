services:
  frontend:
    image: weknora-eval-ui:field-resolution
    container_name: weknora-eval-frontend
    environment:
      MAX_FILE_SIZE_MB: "100"
    ports: !override
      - "127.0.0.1:18080:80"
  app:
    image: weknora-eval-app:mcp-direct
    container_name: weknora-eval-app
    environment:
      SSRF_WHITELIST_EXTRA: "searxng,qdrant,milvus,weaviate,doris-fe,doris-be,minio,dashscope.aliyuncs.com,cotton-data,structured-data,commodity-research,html.duckduckgo.com,api.duckduckgo.com"
      COMMODITY_RESEARCH_URL: http://commodity-research:8765
      STRUCTURED_DATA_URL: http://structured-data:18082
      COMMODITY_RESEARCH_TOKEN_FILE: /run/secrets/research-token
      LOG_FORMAT: ""
      BATCH_EMBED_SIZE: "2"
      MAX_FILE_SIZE_MB: "100"
    ports: !override
      - "127.0.0.1:18081:8080"
    volumes:
      - ../commodity-research/data/service-token:/run/secrets/research-token:ro
  docreader:
    container_name: weknora-eval-docreader
    environment:
      MAX_FILE_SIZE_MB: "100"
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: "100"
  postgres:
    # Preserve the existing local database engine; production pins separately.
    image: paradedb/paradedb:v0.22.6-pg17
    container_name: weknora-eval-postgres
  redis:
    container_name: weknora-eval-redis
