[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weknora-structured-data"
version = "0.1.0"
description = "Auditable Excel data tools for the local WeKnora pilot"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5", "openpyxl==3.1.5", "fastapi==0.141.1", "uvicorn==0.54.0", "mcp==1.30.0", "python-multipart==0.0.32"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
structured-data = "structured_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structured_data = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
