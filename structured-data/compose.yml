services:
  structured-data:
    build: .
    image: weknora-structured-data:local
    command: ["python", "-m", "structured_data.cli", "--data-dir", "/data", "serve", "--host", "0.0.0.0", "--port", "18082"]
    container_name: weknora-structured-data
    restart: unless-stopped
    environment:
      WEKNORA_API_URL: http://app:8080
      MAX_FILE_SIZE_MB: "100"
      STRUCTURED_TENANT_ID: "10000"
      PYTHONPATH: /app/src
      STRUCTURED_MODEL_CONFIG: /run/secrets/model-config.json
      STRUCTURED_SERVICE_TOKEN_FILE: /run/secrets/research-token
      PDF_TABLE_PARSER_ENGINE: ${PDF_TABLE_PARSER_ENGINE:-}
      PDF_TABLE_PARSER_URL: ${PDF_TABLE_PARSER_URL:-}
      PDF_TABLE_PARSER_API_KEY: ${PDF_TABLE_PARSER_API_KEY:-}
      PDF_TABLE_PARSER_TIER: ${PDF_TABLE_PARSER_TIER:-standard}
    ports:
      - "127.0.0.1:18082:18082"
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
      - ../.private/model-config.json:/run/secrets/model-config.json:ro
      - ../commodity-research/data/service-token:/run/secrets/research-token:ro
    networks:
      weknora:
        aliases: [cotton-data]
networks:
  weknora:
    external: true
    name: weknora-eval_WeKnora-network
