services:
  frontend:
    image: ${FRONTEND_IMAGE:-${IMAGE_PREFIX:?release.env required}-frontend:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-18080}:80"
    environment:
      MAX_FILE_SIZE_MB: "100"
    depends_on:
      app:
        condition: service_healthy
      structured-data:
        condition: service_healthy
      commodity-research:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/structured/health && wget -q -O /dev/null http://127.0.0.1/research/healthz && wget -q -O /dev/null http://127.0.0.1/research/static/app.css && wget -q -O /dev/null http://127.0.0.1/research/static/app.js"]
      interval: 15s
      timeout: 10s
      retries: 5

  app:
    image: ${APP_IMAGE:-${IMAGE_PREFIX:?release.env required}-app:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    env_file: ${DEPLOY_SHARED_DIR:?shared directory required}/.env
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      RETRIEVE_DRIVER: postgres
      REDIS_ADDR: redis:6379
      DOCREADER_ADDR: docreader:50051
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      GIN_MODE: release
      MAX_FILE_SIZE_MB: "100"
      BATCH_EMBED_SIZE: "2"
      SSRF_WHITELIST_EXTRA: "structured-data,cotton-data,commodity-research"
      COMMODITY_RESEARCH_URL: http://commodity-research:8765
      STRUCTURED_DATA_URL: http://structured-data:18082
      COMMODITY_RESEARCH_TOKEN_FILE: /run/secrets/research-token
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ${DEPLOY_SHARED_DIR:?shared directory required}/research-service-token:/run/secrets/research-token:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  structured-data:
    image: ${STRUCTURED_DATA_IMAGE:-${IMAGE_PREFIX:?release.env required}-structured-data:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    environment:
      WEKNORA_API_URL: http://app:8080
      MAX_FILE_SIZE_MB: "100"
      STRUCTURED_TENANT_ID: ${STRUCTURED_TENANT_ID:?set the actual tenant ID}
      STRUCTURED_PUBLIC_ORIGIN: ${STRUCTURED_PUBLIC_ORIGIN:-}
      STRUCTURED_DATA_DIR: /data
      STRUCTURED_SERVICE_TOKEN_FILE: /run/secrets/research-token
      STRUCTURED_REVIEW_TIMEOUT_SECONDS: ${STRUCTURED_REVIEW_TIMEOUT_SECONDS:-300}
      STRUCTURED_REVIEW_MEMORY_MB: ${STRUCTURED_REVIEW_MEMORY_MB:-768}
      PDF_TABLE_PARSER_ENGINE: ${PDF_TABLE_PARSER_ENGINE:-}
      PDF_TABLE_PARSER_URL: ${PDF_TABLE_PARSER_URL:-}
      PDF_TABLE_PARSER_API_KEY: ${PDF_TABLE_PARSER_API_KEY:-}
      PDF_TABLE_PARSER_TIER: ${PDF_TABLE_PARSER_TIER:-standard}
    volumes:
      - structured-data:/data
      - ${DEPLOY_SHARED_DIR:?shared directory required}/research-service-token:/run/secrets/research-token:ro
    networks:
      default:
        aliases: [cotton-data]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  commodity-research:
    image: ${COMMODITY_RESEARCH_IMAGE:-${IMAGE_PREFIX:?release.env required}-commodity-research:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    environment:
      TIN_WEKNORA_API_URL: http://app:8080
      TIN_PUBLIC_PREFIX: /research
      TIN_DATA_DIR: /data
      TIN_EXPORTS_DIR: /data/exports
      TIN_STAGING_DIR: /data/import_staging
      TIN_SERVICE_TOKEN_FILE: /run/secrets/research-token
      TIN_STRUCTURED_DATA_URL: http://structured-data:18082
    volumes:
      - commodity-research:/data
      - ${DEPLOY_SHARED_DIR:?shared directory required}/research-service-token:/run/secrets/research-token:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  docreader:
    image: ${DOCREADER_IMAGE:-${IMAGE_PREFIX:?release.env required}-docreader:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    environment:
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: "100"
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: "100"
    volumes:
      - docreader-tmp:/tmp/docreader
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  postgres:
    image: ${POSTGRES_IMAGE:-${IMAGE_PREFIX:?release.env required}-postgres:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 1m

  redis:
    image: ${REDIS_IMAGE:-${IMAGE_PREFIX:?release.env required}-redis:${IMAGE_TAG:?release.env required}}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  data-files:
  docreader-tmp:
  structured-data:
  postgres-backups:
  commodity-research:
