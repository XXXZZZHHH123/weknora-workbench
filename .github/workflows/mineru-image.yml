name: MinerU worker image

on:
  pull_request:
    branches: [main]
    paths:
      - services/mineru/**
      - .github/workflows/mineru-image.yml
  push:
    branches: [main]
    paths:
      - services/mineru/**
      - .github/workflows/mineru-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mineru-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate entrypoint and isolated Compose configuration
        env:
          MINERU_IMAGE: mineru-worker:ci
          MINERU_SETTINGS_FILE: ${{ runner.temp }}/mineru-settings.json
          MINERU_DATA_DIR: ${{ runner.temp }}/mineru-data
          MINERU_MODEL_CACHE_DIR: ${{ runner.temp }}/mineru-models
        run: |
          python3 -m py_compile services/mineru/entrypoint.py
          python3 -m unittest discover -s services/mineru -p 'test_*.py' -v
          mkdir -p "$MINERU_DATA_DIR" "$MINERU_MODEL_CACHE_DIR"
          python3 - <<'PY'
          import json, os
          with open(os.environ['MINERU_SETTINGS_FILE'], 'w') as f:
              json.dump({'api_key': 'ci-placeholder-' * 4, 'vlm_mode': 'local'}, f)
          PY
          python3 services/mineru/entrypoint.py --check
          docker compose -f services/mineru/compose.yml config --quiet
      - name: Set immutable image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}-mineru:4.0.12-$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/mineru
          file: services/mineru/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mineru-cpu
          cache-to: type=gha,mode=max,scope=mineru-cpu
      - name: Verify pinned CPU runtime without models or network
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --network none --read-only --entrypoint python "$IMAGE" -c "from importlib.metadata import version; import importlib.util; import onnxruntime, mineru_llama_cpp; assert version('mineru') == '4.0.12'; assert version('mineru-llama-cpp') == '0.1.4'; assert importlib.util.find_spec('torch') is None; print('Pinned ONNX and llama.cpp runtime imports passed; model parsing not tested')"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"
