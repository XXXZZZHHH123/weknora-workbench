name: Workbench CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all service images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: structured-data/pyproject.toml
      - run: python -m pip install -e './structured-data[test]'
      - run: python -m pytest structured-data/tests -q

  commodity-research:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: commodity-research
    env:
      TIN_LLM_PROVIDER: fake
      TIN_WEKNORA_API_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: commodity-research/requirements.txt
      - run: python -m pip install -r requirements.txt -e .
      - run: python -m pytest tests -q
      - name: Migrate an isolated empty research database
        run: |
          export TIN_DATABASE_URL="sqlite:///$RUNNER_TEMP/research-migration.db"
          export TIN_DATA_DIR="$RUNNER_TEMP/research-data"
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: WeKnora/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WeKnora/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test -- 'src/**/*.test.ts'

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WeKnora
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: WeKnora/go.mod
          cache-dependency-path: WeKnora/go.sum
      - run: go test ./internal/agent/tools ./internal/agent -run 'TestMCP|TestCastParams|TestStructured|TestIndependentReview|TestReviewDraft|TestCommodityResearch|TestEveryBuiltIn|TestAvailableToolDefinitions' -count=1
      - run: go test ./internal/handler -run TestUpdateModel -count=1
      - run: go test ./internal/application/service -run 'TestAgentConfig|TestBuildAssistantHistoryMessages|TestBuildTurnBodyMessages|TestMCPProxyHistory|TestRegisterToolsCommodityResearch' -count=1

  deployment-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          python3 scripts/sync_weknora.py --validate-state
          for script in deploy/*.sh; do bash -n "$script"; done
          bash -n start.sh structured-data/scripts/start.sh structured-data/scripts/build_frontend.sh commodity-research/deploy/container/entrypoint.sh
          shellcheck deploy/*.sh start.sh structured-data/scripts/start.sh structured-data/scripts/build_frontend.sh commodity-research/deploy/container/entrypoint.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Validate Compose without real credentials
        env:
          IMAGE_PREFIX: ghcr.io/example/workbench
          IMAGE_TAG: test
          DEPLOY_SHARED_DIR: ${{ runner.temp }}/workbench-shared
        run: |
          mkdir -p "$DEPLOY_SHARED_DIR"
          cp deploy/.env.example "$DEPLOY_SHARED_DIR/.env"
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-placeholder/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-placeholder/' "$DEPLOY_SHARED_DIR/.env"
          docker compose --env-file "$DEPLOY_SHARED_DIR/.env" -f deploy/compose.yml config --quiet

  image-plan:
    needs: [python, commodity-research, frontend, go, deployment-checks]
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reuse images with identical tracked build inputs
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true }}
        run: |
          previous_args=()
          if gh api "repos/$REPOSITORY/releases/latest" > latest.json 2> lookup.err; then
            previous_tag="$(jq -er '.tag_name | select(test("^production-[a-f0-9]{40}-[0-9]+-[0-9]+$"))' latest.json)"
            mkdir previous
            gh release download "$previous_tag" --repo "$REPOSITORY" --pattern deployment.tar.gz --dir previous
            previous_args=(--previous previous/deployment.tar.gz)
          elif ! grep -q 'HTTP 404' lookup.err; then
            cat lookup.err >&2
            exit 1
          fi
          force_args=()
          if [[ "$FORCE_REBUILD" == true ]]; then force_args=(--force); fi
          matrix="$(python3 deploy/image_plan.py --repository "$REPOSITORY" "${previous_args[@]}" "${force_args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq '.include[] | {service, reuse_image}'

  images:
    needs: image-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reused image or prepare a fresh build
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVICE: ${{ matrix.service }}
          CANDIDATE: ${{ matrix.reuse_image }}
          PUBLISH_IMAGES: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          tag="production-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
          image="$prefix-$SERVICE:$tag"
          reused=false
          if [[ "$PUBLISH_IMAGES" == true && -n "$CANDIDATE" ]] && docker buildx imagetools inspect "$CANDIDATE" >/dev/null; then
            image="$CANDIDATE"
            reused=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
      - name: Make room for the Go and Rust build
        if: matrix.service == 'app' && steps.image.outputs.reused != 'true'
        run: |
          sudo python3 - <<'PYTHON'
          import os, shutil
          print('Free bytes before:', shutil.disk_usage('/').free)
          for path in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc'):
              if os.path.isdir(path):
                  shutil.rmtree(path)
          print('Free bytes after:', shutil.disk_usage('/').free)
          PYTHON
      - name: Restore Go compiler cache for the app image
        if: matrix.service == 'app' && steps.image.outputs.reused != 'true'
        id: go-build-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build/app-go-build-cache
          key: linux-amd64-app-go-build-${{ hashFiles('WeKnora/go.mod', 'WeKnora/go.sum', 'WeKnora/third_party/anydoc-go/go.mod') }}
      - name: Inject and preserve the Go compiler cache mount
        if: matrix.service == 'app' && steps.image.outputs.reused != 'true'
        uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{".build/app-go-build-cache":"/root/.cache/go-build"}'
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.image.outputs.reused != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_FRONTEND_COMMIT=${{ github.sha }}
            COMMIT_ID_ARG=${{ github.sha }}
            RELEASE_SHA=${{ github.sha }}
            VERSION_ARG=${{ steps.image.outputs.tag }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record actual service image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_REF: ${{ steps.image.outputs.image }}
          INPUT_HASH: ${{ matrix.input_hash }}
        run: |
          mkdir coordinates
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          service = os.environ['SERVICE']
          Path('coordinates', service + '.json').write_text(json.dumps({
              'service': service, 'image': os.environ['IMAGE_REF'], 'input_hash': os.environ['INPUT_HASH']}))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}
          path: coordinates/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: coordinates
      - name: Publish deployment bundle after all images succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          release_id="production-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
          mkdir -p bundle
          cp deploy/compose.yml deploy/deploy.sh bundle/
          python3 deploy/image_plan.py --repository "$REPOSITORY" --coordinates coordinates --tag "$release_id" --output bundle/release.env
          tar -czf deployment.tar.gz -C bundle compose.yml deploy.sh release.env
          sha256sum deployment.tar.gz > deployment.tar.gz.sha256
          printf 'Commit: %s\nPlatform: linux/amd64\nTests passed. All seven service images were built or verified for reuse; exact references are in release.env.\n' "$COMMIT" > release-notes.txt
          gh release create "$release_id" deployment.tar.gz deployment.tar.gz.sha256 --repo "$REPOSITORY" --target "$COMMIT" --title "$release_id" --notes-file release-notes.txt --draft
          gh release edit "$release_id" --repo "$REPOSITORY" --draft=false --latest
