name: Workbench CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: structured-data/pyproject.toml
      - run: python -m pip install -e './structured-data[test]'
      - run: python -m pytest structured-data/tests -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: WeKnora/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WeKnora/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test -- 'src/**/*.test.ts'

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WeKnora
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: WeKnora/go.mod
          cache-dependency-path: WeKnora/go.sum
      - run: go test ./internal/agent/tools ./internal/agent -run TestMCP -count=1

  deployment-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Validate Compose without real credentials
        env:
          IMAGE_PREFIX: ghcr.io/example/workbench
          IMAGE_TAG: test
          DEPLOY_SHARED_DIR: ${{ runner.temp }}/workbench-shared
        run: |
          mkdir -p "$DEPLOY_SHARED_DIR"
          cp deploy/.env.example "$DEPLOY_SHARED_DIR/.env"
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-placeholder/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-placeholder/' "$DEPLOY_SHARED_DIR/.env"
          docker compose --env-file "$DEPLOY_SHARED_DIR/.env" -f deploy/compose.yml config --quiet

  images:
    needs: [python, frontend, go, deployment-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            context: WeKnora
            dockerfile: WeKnora/docker/Dockerfile.app
            base_image: redis:7.0-alpine
          - service: frontend
            context: .
            dockerfile: deploy/Dockerfile.frontend
            base_image: redis:7.0-alpine
          - service: structured-data
            context: structured-data
            dockerfile: structured-data/Dockerfile
            base_image: redis:7.0-alpine
          - service: docreader
            context: .
            dockerfile: deploy/Dockerfile.runtime
            base_image: wechatopenai/weknora-docreader:v0.8.2
          - service: postgres
            context: .
            dockerfile: deploy/Dockerfile.runtime
            base_image: paradedb/paradedb:v0.22.6-pg17
          - service: redis
            context: .
            dockerfile: deploy/Dockerfile.runtime
            base_image: redis:7.0-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=production-$COMMIT-$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_FRONTEND_COMMIT=${{ github.sha }}
            COMMIT_ID_ARG=${{ github.sha }}
            VERSION_ARG=${{ steps.image.outputs.tag }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish deployment bundle after all images succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          release_id="production-$COMMIT-$RUN_ID-$RUN_ATTEMPT"
          mkdir -p bundle
          cp deploy/compose.yml deploy/deploy.sh bundle/
          printf 'IMAGE_PREFIX=ghcr.io/%s\nIMAGE_TAG=%s\n' "${REPOSITORY,,}" "$release_id" > bundle/release.env
          tar -czf deployment.tar.gz -C bundle compose.yml deploy.sh release.env
          sha256sum deployment.tar.gz > deployment.tar.gz.sha256
          printf 'Commit: %s\nPlatform: linux/amd64\nTests and all six image builds passed. The server deploys this release by polling.\n' "$COMMIT" > release-notes.txt
          # Upload to a draft first: pollers must never see an incomplete bundle.
          gh release create "$release_id" deployment.tar.gz deployment.tar.gz.sha256 --repo "$REPOSITORY" --target "$COMMIT" --title "$release_id" --notes-file release-notes.txt --draft
          gh release edit "$release_id" --repo "$REPOSITORY" --draft=false --latest
